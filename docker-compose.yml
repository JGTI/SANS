version: '3.8'

services:
  # 1. Laravel Web Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spacevision_app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost:8000
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=nexus_spaceappschallenge
      - DB_USERNAME=spacevision
      - DB_PASSWORD=SpaceVision2026!
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QUEUE_CONNECTION=redis
      - SCIENTIFIC_ENGINE_URL=http://scientific-engine:8001
      - SCIENTIFIC_ENGINE_TOKEN=spacevision-scientific-secret-token-2026
    depends_on:
      - db
      - redis
      - scientific-engine
    networks:
      - spacevision_network

  # 2. Python Scientific Computing & Machine Learning Microservice
  scientific-engine:
    build:
      context: ./scientific_engine
      dockerfile: Dockerfile
    container_name: spacevision_scientific_engine
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - APP_ENV=production
      - SCIENTIFIC_ENGINE_HOST=0.0.0.0
      - SCIENTIFIC_ENGINE_PORT=8001
      - SCIENTIFIC_ENGINE_TOKEN=spacevision-scientific-secret-token-2026
    networks:
      - spacevision_network

  # 3. Primary Relational Database
  db:
    image: mariadb:10.11
    container_name: spacevision_db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: nexus_spaceappschallenge
      MYSQL_USER: spacevision
      MYSQL_PASSWORD: SpaceVision2026!
    volumes:
      - spacevision_db_data:/var/lib/mysql
    networks:
      - spacevision_network

  # 4. In-Memory Cache & Laravel Queue Broker
  redis:
    image: redis:7-alpine
    container_name: spacevision_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - spacevision_redis_data:/data
    networks:
      - spacevision_network

networks:
  spacevision_network:
    driver: bridge

volumes:
  spacevision_db_data:
  spacevision_redis_data:
